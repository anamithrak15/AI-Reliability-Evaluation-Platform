services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aireliability}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-aireliability}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aireliability}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-aireliability}
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: ${DEMO_MODE:-true}
      ENABLE_LIVE_LLM: ${ENABLE_LIVE_LLM:-false}
      LIVE_MODELS: ${LIVE_MODELS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      LIVE_TIMEOUT_SECONDS: ${LIVE_TIMEOUT_SECONDS:-120}
      LIVE_BUDGET_USD_PER_MODEL: ${LIVE_BUDGET_USD_PER_MODEL:-0.05}
      LIVE_BUDGET_OVERRIDES: ${LIVE_BUDGET_OVERRIDES:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SECRET_KEY: ${SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEMO_DATASET_PATH: /datasets/demo_dataset.json
    volumes:
      - ../datasets:/datasets:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ../backend
    command: python -m app.worker.main
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ../frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
