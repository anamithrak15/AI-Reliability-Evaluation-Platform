name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aireliability
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: aireliability
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aireliability" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://aireliability:ci-password@localhost:5432/aireliability_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,live]" pip-audit
      - name: Lint
        run: ruff check app tests
      - name: Tests
        run: pytest -q
      - name: Dependency audit
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit (all packages)
        run: npm audit

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile.prod -t ai-reliability-api .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile.prod -t ai-reliability-frontend frontend
      - name: Validate compose files
        run: |
          POSTGRES_PASSWORD=x SECRET_KEY=x docker compose -f infra/docker-compose.prod.yml config -q
          docker compose -f infra/docker-compose.yml config -q
