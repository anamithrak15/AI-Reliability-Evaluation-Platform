[project]
name = "ai-reliability-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "redis>=5.0,<6",
    "rq>=1.16,<3",
    "jsonschema>=4.22,<5",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.8,<3",
    "email-validator>=2.1,<3",
]

[project.optional-dependencies]
live = [
    "litellm>=1.50,<2",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# FastAPI declares dependencies as default arguments.
ignore = ["B008"]
